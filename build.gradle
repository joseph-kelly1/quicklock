plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Jar).configureEach {
    from('LICENSE') { rename { 'LICENSE_quicklock' } }
    from('THIRD_PARTY_NOTICES.md')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'quicklock-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

if (providers.gradleProperty('withLithium').isPresent()) {
    repositories { maven { url = 'https://api.modrinth.com/maven' } }
    dependencies { gametestImplementation 'maven.modrinth:lithium:mc26.3-0.26.2-fabric' }
}
