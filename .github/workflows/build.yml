name: Build and protection tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lithium: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit and dedicated-server tests
        run: ./gradlew build ${{ matrix.lithium && '-PwithLithium' || '' }}
      - name: Verify persistence in a second server process
        run: ./gradlew runGameTest ${{ matrix.lithium && '-PwithLithium' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quicklock-lithium-${{ matrix.lithium }}
          path: |
            build/libs/*.jar
            build/reports/
            build/test-results/
            build/run/gameTest/logs/latest.log
